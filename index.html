<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orkut?</title>
    <meta name="description" content="Busque usuários do GitHub e veja seus repositórios públicos." />
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header class="header">
      <section id="navtabs" class="header__inner">
        <div id="logo" class="header__brand">
          <img class="header__brand-img" src="./assets/orkut-logo.png" alt="logo" />
        </div>
        <div class="header__nav-wrapper">
          <nav class="header__nav">
            <a class="header__nav-link">Início</a>
            <a class="header__nav-link">Perfil</a>
            <a class="header__nav-link">Página de recados</a>
            <a class="header__nav-link">Amigos</a>
            <a class="header__nav-link">Comunidades</a>
          </nav>
          <form id="search-form" class="search-form" novalidate>
            <div class="search-form__row">
              <input
                type="text"
                id="username-input"
                name="username"
                class="search-form__input"
                placeholder="Buscar pessoas..."
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                required
              />
            </div>
          </form>
        </div>
      </section>
    </header>
    <main id="wrapper" class="layout">
      <aside id="sidebar" class="layout__sidebar">
        <section id="loadbox_img-card" aria-live="polite" aria-atomic="true"></section>
        <section class="card history" id="info-box">
          <div class="card__title">Histórico de buscas</div>
          <div class="card__body">
              <ul id="history-list" class="history__list">
                <li class="history__empty">Nenhuma busca realizada.</li>
              </ul>
              <div class="history__footer">
                <button type="button" id="clear-history" class="button button--ghost history__clear">
                  Limpar histórico
                </button>
              </div>
          </div>
        </section>
      </aside>
      <section id="main" class="layout__main">
        <div class="card">
          <div id="loadbox_info-card" aria-live="polite" aria-atomic="true"></div>
        </div>
        <section id="result" class="result" aria-live="polite" aria-atomic="true">
          <p class="result__empty">...</p>
        </section>
      </section>
      <aside class="layout__aside">
        <div id="loadbox_followers-card" aria-live="polite" aria-atomic="true"></div>
        <div id="loadbox_repo-card" aria-live="polite" aria-atomic="true"></div>
      </aside>
    </main>
    <footer class="site-footer">
      <p>Copyright © 2004</p>
    </footer>

    <div>
      <template id="template-loading">
        <p class="state state--loading" role="status">
          Buscando usuário...
        </p>
      </template>

      <template id="template-not-found">
        <p class="state state--error" role="alert">
          Usuário não encontrado. Confira o nome digitado e tente novamente.
        </p>
      </template>

      <template id="template-rate-limit">
        <p class="state state--warning" role="alert">
          <span>Limite de requisições da API do GitHub atingido. Tente novamente às <time id="rate-limit-time"></time>.</span>
        </p>
      </template>

      <template id="template-user-card">
        <div class="card user-card" id="photo-box">
          <div class="card__body user-card__body">
            <img class="user-card__img" src="" alt="">
            <h2 class="user-card__name"></h2>
            <div class="user-card__login"></div>
          </div>
        </div>
      </template>

      <template id="template-info-card">
        <div class="info-card">
          <h2 class="info-card__name"></h2>
          <p class="info-card__breadcrumb"><span class="info-card__breadcrumb-highlight">Início</span> > Meu perfil</p>
          <div class="info-card__bio">
            <p class="info-card__bio-text"></p>
          </div>
          <div class="info-card__badges">
            <img class="info-card__badge" src="./assets/img_01.png" alt="Qualidades" />
            <img class="info-card__badge" src="./assets/img_02.png" alt="Qualidades" />
          </div>
        </div>
      </template>

      <template id="template-user-repo">
        <div class="card repo-list" id="comunidades-box">
          <div class="card__title">Repositórios públicos <span class="repo-list__count"></span></div>
          <ul class="repo-list__items"></ul>
        </div>
      </template>

      <template id="template-user-followers">
        <div class="card followers-grid" id="amigos-box">
          <div class="card__title">Seguidores <span class="followers-grid__count"></span></div>
          <div class="followers-grid__items">
          </div>
        </div>
      </template>

      <template id="template-history-item">
        <li class="history__item">
          <span class="history__item-label"></span>
          <time class="history__item-time"></time>
        </li>
      </template>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
